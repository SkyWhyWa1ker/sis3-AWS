name: SIS3 CI-CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: sis3-main-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STACK_BASE: sis3-main

jobs:
  deploy:
    name: Test, build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find project directory
        shell: bash
        run: |
          if [ -f "sis3-orders/infra/app.yaml" ]; then
            echo "PROJECT_DIR=sis3-orders" >> "$GITHUB_ENV"
          elif [ -f "infra/app.yaml" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "Could not find infra/app.yaml"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests and validate templates
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash check.sh

      - name: Connect to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find ECR repository
        shell: bash
        run: |
          REPO_NAME=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_BASE}-registry" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryName'].OutputValue | [0]" \
            --output text)

          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_BASE}-registry" \
            --query "Stacks[0].Outputs[?OutputKey=='RepositoryUri'].OutputValue | [0]" \
            --output text)

          if [ -z "$REPO_NAME" ] || [ "$REPO_NAME" = "None" ] || \
             [ -z "$REPO_URI" ] || [ "$REPO_URI" = "None" ]; then
            echo "Could not find the ECR repository in the registry stack outputs."
            exit 1
          fi

          echo "REPO_NAME=$REPO_NAME" >> "$GITHUB_ENV"
          echo "REPO_URI=$REPO_URI" >> "$GITHUB_ENV"

      - name: Build and push image
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          IMAGE_URI="${REPO_URI}:${GITHUB_SHA}"

          if aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image already exists: $IMAGE_URI"
          else
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login \
                  --username AWS \
                  --password-stdin "${REPO_URI%%/*}"

            docker build \
              --platform linux/amd64 \
              -t "$IMAGE_URI" .

            docker push "$IMAGE_URI"
          fi

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy CloudFormation stack
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          aws cloudformation deploy \
            --stack-name "${STACK_BASE}-app" \
            --template-file infra/app.yaml \
            --parameter-overrides \
              "Env=dev" \
              "ImageUri=${IMAGE_URI}" \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset

      - name: Check application health
        shell: bash
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_BASE}-app" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue | [0]" \
            --output text)

          if [ -z "$API_URL" ] || [ "$API_URL" = "None" ]; then
            echo "Could not find ApiUrl in stack outputs."
            exit 1
          fi

          echo "Checking ${API_URL}/health"
          curl --fail --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            "${API_URL}/health"

      - name: Show deployed image
        shell: bash
        run: |
          echo "Commit SHA: $GITHUB_SHA"
          echo "Image URI: $IMAGE_URI"
