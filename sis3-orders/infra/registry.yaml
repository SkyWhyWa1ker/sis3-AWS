AWSTemplateFormatVersion: '2010-09-09'
Description: SIS3 per-copy immutable ECR registry
Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Expire untagged images after 1 day","selection":{"tagStatus":"untagged","countType":"sinceImagePushed","countUnit":"days","countNumber":1},"action":{"type":"expire"}}]}
Outputs:
  RepositoryName:
    Value: !Ref Repository
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
